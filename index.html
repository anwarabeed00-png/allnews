<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>كل الأخبار - تسجيل الدخول</title>

    <style>
        body { 
            background-color: #0d1117; 
            color: #c9d1d9; 
            font-family: 'Segoe UI', Tahoma, sans-serif; 
            margin: 0; 
            padding: 0; 
        }

        /* --- شاشة تسجيل الدخول --- */
        #login-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #0d1117; display: flex; align-items: center; justify-content: center;
            z-index: 9999;
        }
        .login-card {
            background: #161b22; padding: 30px; border-radius: 12px; border: 1px solid #30363d;
            width: 90%; max-width: 400px; text-align: center;
        }
        .login-card h2 { color: #c28a29; margin-bottom: 20px; }
        .login-card input {
            width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px;
            border: 1px solid #30363d; background: #0d1117; color: white; box-sizing: border-box;
        }
        .login-btn {
            width: 100%; padding: 12px; background: #c28a29; color: #0d1117;
            border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 10px;
        }
        .error-msg { color: #ff7b72; font-size: 14px; margin-top: 10px; display: none; }

        /* --- محتوى الموقع (مخفي قبل الدخول) --- */
        #main-content { display: none; }

        .container { 
            max-width: 900px; 
            margin: auto; 
            padding: 20px; 
            box-sizing: border-box;
        }

        .fixed-header {
            position: sticky;
            top: 0;
            z-index: 1000;
            background-color: #0d1117;
            padding: 20px 0 10px 0; /* تم تعديل الحشو لضبط المحاذاة */
        }

        /* ضبط حاوية البحث لتطابق عرض الكروت */
        .search-container { 
            width: 100%;
            max-width: 900px;
            margin: auto;
            padding: 0 20px; /* نفس حشو الـ container */
            box-sizing: border-box;
        }

        .banner-container {
            width: calc(100% - 40px);
            max-width: 860px;
            margin: 0 auto 15px auto;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #30363d;
        }
        .banner-container img { width: 100%; height: auto; display: block; }

        .search-box { 
            width: 100%; 
            padding: 15px 20px; 
            border-radius: 10px; 
            border: 1px solid #30363d; 
            background: #161b22; 
            color: #c9d1d9; 
            font-size: 18px; 
            box-sizing: border-box; 
            outline: none; 
        }

        .card { 
            background: #161b22; 
            border: 1px solid #30363d; 
            border-radius: 12px; 
            padding: 20px; 
            margin-bottom: 20px; 
            border-right: 5px solid #c28a29; 
            overflow: hidden;
            box-sizing: border-box;
        }

        .date-badge { 
            background: #c28a29; padding: 4px 12px; border-radius: 15px; 
            color: #0d1117; font-size: 12px; font-weight: bold; float: left; 
        }

        .country-badge { background: #1b4a80; color: #fff; padding: 4px 10px; border-radius: 15px; font-size: 12px; font-weight: bold; }
        
        .title { color: #c28a29; font-size: 20px; margin: 15px 0 10px 0; font-weight: bold; clear: both; }
        
        .card-image {
            width: 100%;
            height: 250px;
            object-fit: cover;
            border-radius: 8px;
            margin: 10px 0;
            border: 1px solid #30363d;
            display: block;
        }

        .content { font-size: 15px; line-height: 1.6; color: #d1d7de; }
        
        #status { text-align: center; padding: 20px; color: #8b949e; }
        #load-more { text-align: center; padding: 20px; display: none; cursor: pointer; color: #58a6ff; font-weight: bold; }
    </style>
</head>
<body>

    <div id="login-overlay">
        <div class="login-card">
            <h2>🔐 دخول الأعضاء</h2>
            <input type="text" id="username" placeholder="اسم المستخدم">
            <input type="password" id="password" placeholder="كلمة المرور">
            <button class="login-btn" onclick="attemptLogin()">دخول</button>
            <div id="login-error" class="error-msg">⚠️ اسم المستخدم أو كلمة المرور غير صحيحة!</div>
        </div>
    </div>

    <div id="main-content">
        <div class="fixed-header">
            <div class="banner-container">
                <img src="https://lh3.googleusercontent.com/d/121pu5J6j0AnTCRweYS98kMJJLYwlf_4e" alt="Banner">
            </div>

            <div class="search-container">
                <input type="text" id="searchInput" class="search-box" placeholder="🔍 ابحث في الأخبار..." onkeyup="handleSearch()">
            </div>
        </div>

        <div class="container">
            <div id="archive-container"></div>
            <div id="status">جاري تحميل البيانات...</div>
            <div id="load-more" onclick="renderNextBatch()">👇 عرض المزيد من الأخبار</div>
        </div>
    </div>

    <script>
        // روابط جداول البيانات
        const SHEET_ID = '1-j08dJ4bUh4kwKX5Tc__KobBMEBhgP8BoHQerTENn4Y';
        const USERS_SHEET_ID = '1JPGIQxNFPHu0lxupFVOUvfIrjxCe-fX_7qpsmIyx1qA';
        
        const CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv`;
        const USERS_CSV_URL = `https://docs.google.com/spreadsheets/d/${USERS_SHEET_ID}/export?format=csv`;
        
        let allData = [];
        let filteredData = [];
        let currentIndex = 0;
        const BATCH_SIZE = 20;

        // دالة تسجيل الدخول
        async function attemptLogin() {
            const userIn = document.getElementById('username').value.trim();
            const passIn = document.getElementById('password').value.trim();
            const errorDiv = document.getElementById('login-error');

            if(!userIn || !passIn) return;

            try {
                const response = await fetch(USERS_CSV_URL);
                const csvText = await response.text();
                // تحليل ملف المستخدمين (اسم المستخدم عمود 1، الباسورد عمود 2)
                const rows = csvText.split('\n').map(row => row.split(',').map(cell => cell.replace(/"/g, '').trim()));
                
                const userMatch = rows.find(row => row[0] === userIn && row[1] === passIn);

                if (userMatch) {
                    document.getElementById('login-overlay').style.display = 'none';
                    document.getElementById('main-content').style.display = 'block';
                    fetchData(); // جلب الأخبار فقط بعد النجاح
                } else {
                    errorDiv.style.display = 'block';
                }
            } catch (e) {
                alert("حدث خطأ أثناء التحقق من البيانات. تأكد من أن ملف المستخدمين متاح للجميع (Anyone with link).");
            }
        }

        // دالة جلب بيانات الأخبار
        async function fetchData() {
            try {
                const response = await fetch(CSV_URL);
                const csvText = await response.text();
                const rows = csvText.split('\n').map(row => {
                    return row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(cell => cell.replace(/"/g, '').trim());
                });

                allData = rows.slice(1).filter(r => r[0] && r[1]).map(r => ({
                    country: r[0], 
                    title: r[1], 
                    content: r[2] || "",
                    dateText: r[3], 
                    sortKey: r[3] ? r[3].split('/').reverse().join('') : '0',
                    imageUrl: r[6] || "" 
                }));

                allData.sort((a, b) => b.sortKey.localeCompare(a.sortKey));
                filteredData = [...allData];
                
                document.getElementById('status').style.display = 'none';
                renderNextBatch(true);

            } catch (e) {
                document.getElementById('status').innerText = "خطأ في الاتصال بالبيانات.";
            }
        }

        function renderNextBatch(reset = false) {
            const container = document.getElementById('archive-container');
            if (reset) {
                container.innerHTML = "";
                currentIndex = 0;
            }

            const nextBatch = filteredData.slice(currentIndex, currentIndex + BATCH_SIZE);
            let html = "";
            nextBatch.forEach(item => {
                const imgTag = item.imageUrl ? `<img src="${item.imageUrl}" class="card-image" loading="lazy" alt="news">` : "";

                html += `
                    <div class="card">
                        <span class="date-badge">📅 ${item.dateText}</span>
                        <span class="country-badge">🌍 ${item.country}</span>
                        <div class="title">${item.title}</div>
                        ${imgTag}
                        <div class="content">${item.content}</div>
                    </div>`;
            });

            container.insertAdjacentHTML('beforeend', html);
            currentIndex += BATCH_SIZE;
            document.getElementById('load-more').style.display = currentIndex < filteredData.length ? 'block' : 'none';
        }

        function handleSearch() {
            const term = document.getElementById('searchInput').value.toLowerCase();
            filteredData = allData.filter(item => 
                item.country.toLowerCase().includes(term) || 
                item.title.toLowerCase().includes(term) || 
                item.content.toLowerCase().includes(term)
            );
            renderNextBatch(true);
        }

        // التمرير اللانهائي
        window.onscroll = function() {
            if ((window.innerHeight + window.scrollY) >= document.body.offsetHeight - 500) {
                if (currentIndex < filteredData.length) renderNextBatch();
            }
        };
    </script>
</body>
</html>

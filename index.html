<html lang="ar" dir="rtl">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة كل الأخبار - All News</title>

<!-- مكتبات الخريطة الجيوسياسية -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>


    <style>
        :root { 
            --main-width: 900px; 
            --gold: #c28a29; 
            --bg: #0d1117; 
            --card-bg: #161b22; 
            --border: #30363d; 
            --nav-height: 90px;
            --main-blue: #1d355d;
            --link-blue: #58a6ff; 
        }

        body { background-color: var(--bg); color: #c9d1d9; font-family: 'Segoe UI', Tahoma, sans-serif; margin: 0; padding: 0; overflow-x: hidden; }

        /* --- صفحة الدخول --- */
        #login-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle at center, #1c2128 0%, #0d1117 100%); display: flex; align-items: center; justify-content: center; z-index: 10000; }
        .login-card { background: var(--card-bg); padding: 0 0 30px 0; border-radius: 16px; border: 1px solid var(--border); width: 90%; max-width: 400px; text-align: center; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .login-banner { background: white; padding: 25px; border-bottom: 4px solid var(--gold); margin-bottom: 25px; display: flex; flex-direction: column; align-items: center; }
        .logo-box { display: flex; flex-direction: column; align-items: center; gap: 5px; }
        .logo-svg { width: 60px; height: 60px; }
        .brand-en-sub { font-family: 'Arial Black', sans-serif; font-size: 14px; letter-spacing: 1px; font-weight: bold; }
        .brand-en-sub .all { color: var(--gold); }
        .brand-en-sub .news { color: var(--main-blue); }
        .login-title-ar { display: flex; gap: 8px; font-size: 28px; font-weight: 800; margin-top: 10px; }
        .login-inputs-container { padding: 0 30px; }
        .login-card input { width: 100%; padding: 14px; margin: 10px 0; border-radius: 10px; border: 1px solid var(--border); background: #0d1117; color: white; box-sizing: border-box; font-size: 16px; }
        .login-btn { width: 100%; padding: 14px; background: var(--gold); color: #000; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 17px; margin-top: 15px; }



        /* --- الهيدر العلوي --- */
        .nav-bar { 
           background: var(--card-bg); 
    border-bottom: 1px solid var(--border); 
    display: grid; 
    grid-template-columns: 1fr auto 1fr; 
    align-items: center; 
    padding: 0 40px; /* زيادة الطوق الجانبي لمظهر أكثر اتساعاً */
    height: var(--nav-height); 
    position: sticky; 
    top: 35px !important; /* إزاحة الهيدر ليكون أسفل شريط الطقس تماماً */
    z-index: 9999; 
    box-sizing: border-box;
        }

        
/* المحاذاة جهة اليمين للوجو */
.right-section { 
    display: flex; 
    justify-content: flex-start; 
    align-items: center; 
}

/* تنسيق صندوق اللوجو ليكون مدمجاً وأنيقاً */
.logo-header-box { 
    display: flex; 
    flex-direction: column; 
    align-items: center; 
    cursor: pointer;
}
.logo-header-box svg { 
    width: 42px; /* تكبير طفيف لجعل تفاصيل الشعار واضحة */
    height: 42px; 
}
.logo-header-box .brand-en-sub { 
    font-size: 10px; 
    font-weight: bold; 
    margin-top: 4px; 
    letter-spacing: 0.5px;
}

/* القسم الأوسط: محاذاة العنوان في السنتر تماماً */
.center-section { 
    display: flex; 
    justify-content: center; 
    align-items: center; 
}
.main-title { 
    margin: 0; 
    font-size: 26px; /* حجم خط بارز ومناسب للعنوان الرئيسي */
    font-weight: 800; 
    display: flex; 
    gap: 10px; 
    align-items: center; 
}

/* القسم الأيسر: دفع عناصر التحكم لجهة اليسار */
.left-section { 
    display: flex; 
    justify-content: flex-end; 
    align-items: center; 
    gap: 20px; /* مسافة مريحة بين اسم القسم وزر القائمة */
}



        .active-section-name { 
    color: var(--gold); 
    font-size: 15px; 
    font-weight: bold; 
    white-space: nowrap; 
    background: rgba(194, 138, 41, 0.08); /* خلفية خفيفة جداً لإبراز النص */
    padding: 6px 14px;
    border-radius: 20px;
    border: 1px solid rgba(194, 138, 41, 0.15);
}

/* زر الهامبرغر المطور */
.menu-toggle { 
    display: flex; 
    flex-direction: column; 
    gap: 6px; 
    cursor: pointer; 
    background: none; 
    border: none; 
    padding: 8px; 
    transition: opacity 0.2s;
}
.menu-toggle:hover {
    opacity: 0.8;
}
.menu-toggle span { 
    width: 28px; 
    height: 3px; 
    background-color: var(--gold); 
    border-radius: 2px; 
}

        .nav-menu { position: fixed; top: var(--nav-height); left: -100%; flex-direction: column; background: var(--card-bg); width: 260px; height: calc(100vh - var(--nav-height)); padding: 20px; transition: 0.4s; border-right: 1px solid var(--border); display: flex; gap: 10px; z-index: 10005 !important; }
        .nav-menu.open { left: 0; }
        .nav-btn { width: 100%; background: transparent; border: 1px solid var(--border); color: #8b949e; padding: 12px; border-radius: 8px; cursor: pointer; font-weight: bold; text-align: right; }
        .nav-btn.active { border-color: var(--gold); color: var(--gold); background: rgba(194, 138, 41, 0.1); }

        /* --- شريط الأخبار المتحرك --- */
        .ticker-wrap { 
            width: 100%; overflow: hidden; background-color: #1c2128; border-bottom: 2px solid var(--gold); 
            height: 40px; position: sticky; top: var(--nav-height); z-index: 9990; display: flex; align-items: center; 
        }
        .ticker-label { position: absolute; right: 0; top: 0; bottom: 0; background: var(--gold); color: var(--bg); padding: 0 15px; display: flex; align-items: center; font-weight: bold; z-index: 101; font-size: 14px; }
        .ticker-scroll-area { width: 100%; height: 100%; overflow: hidden; position: relative; }
        .ticker-content { 
            display: flex; white-space: nowrap; position: absolute; right: 0; align-items: center; height: 100%; 
            animation: ticker-loop linear infinite; 
        }
        .ticker-content:hover { animation-play-state: paused; cursor: pointer; }
        .ticker-item { padding: 0 30px; font-size: 14px; color: #fff; }
        .ticker-country { color: var(--gold); font-weight: bold; margin-left: 8px; }

        @keyframes ticker-loop { 0% { transform: translateX(0); } 100% { transform: translateX(50%); } }

        /* --- البطاقات --- */
       .content-wrapper { 
    width: 95%; 
    max-width: var(--main-width); 
    margin: 60px auto 20px auto; /* زيادة الهامش العلوي إلى 60px لترك مسافة للشريط الثابت */
    display: flex; 
    flex-direction: column; 
    align-items: center; 
}
        .search-box { width: 100%; max-width: var(--main-width); padding: 15px; border-radius: 12px; border: 1px solid var(--border); background: var(--card-bg); color: white; font-size: 16px; outline: none; text-align: right; margin-bottom: 25px; box-sizing: border-box; }
        .card { width: 100%; max-width: var(--main-width); background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 25px; margin-bottom: 25px; border-right: 5px solid var(--gold); position: relative; text-align: right; box-sizing: border-box; display: flex; flex-direction: column; }
        .card p { line-height: 1.8; text-align: justify; color: #b2bac2; margin-top: 15px; margin-bottom: 45px; }

        .card-footer { display: flex; justify-content: flex-start; width: 100%; position: absolute; bottom: 20px; right: 25px; font-size: 14px; direction: rtl; }
        .more-prefix { color: var(--link-blue); margin-left: 5px; font-weight: bold; }
        .card-more-link { color: var(--link-blue); text-decoration: none; font-weight: bold; transition: 0.3s; }
        .card-more-link:hover { text-decoration: underline; }

        .date-badge { background: var(--gold); padding: 4px 12px; border-radius: 15px; color: var(--bg); font-size: 11px; font-weight: bold; position: absolute; left: 20px; top: 20px; }
        .country-tag { color: var(--gold); font-size: 14px; font-weight: bold; margin-bottom: 8px; }
        .title { color: #ffffff; font-size: 20px; margin: 0 0 15px 0; font-weight: bold; padding-left: 85px; }
        .card-image { width: 100%; border-radius: 10px; margin: 15px 0; max-height: 480px; object-fit: cover; border: 1px solid var(--border); }
        
        #main-content { display: none; }
        .page-section { display: none; }
        .page-section.active { display: block; }
        #loading-sentinel { text-align: center; padding: 20px; color: var(--gold); font-weight: bold; }

   @media (max-width: 768px) {
    /* 1. ضبط أبعاد البانر وتوزيعه الرأسي */
    .nav-bar {
        height: auto !important;
        padding: 15px 20px;
        grid-template-columns: 1fr; 
        gap: 8px;
    }

    .nav-menu {
        z-index: 10005 !important;
    }

    /* 2. توحيد محاذاة الأقسام الثلاثة في السنتر */
    .right-section, .center-section, .left-section {
        justify-content: center !important;
        text-align: center !important;
    }

    /* 3. تصغير حجم الشعار والعناوين للمحافظة على المساحة */
    .logo-header-box svg {
        width: 36px !important;
        height: 36px !important;
    }
    .logo-header-box .brand-en-sub {
        display: none !important; 
    }
    .main-title { 
        font-size: 22px !important; /* حجم متناسق وموحد بدون تكرار */
    }
    .eid-greet-text { 
        font-size: 14px !important; 
    }
    .active-section-name { 
        display: none !important; 
    }

    /* 4. إجبار شريط الأخبار على الظهور (رفع الـ z-index وضبط الارتفاع) */
    .ticker-wrap {
        position: fixed !important;
        top: 215px !important; /* القيمة الرقمية الكافية للنزول أسفل الطقس والبانر المتمدد */
        z-index: 10002 !important; /* رفع طبقته ليكون أعلى من شريط الطقس والبانر تماماً */
        display: flex !important; /* التأكد من أن عنصره غير مخفي */
    }

    /* 5. دفع صندوق البحث والبطاقات للأسفل لتبدأ بعد شريط الأخبار */
    .content-wrapper { 
        margin: 140px auto 20px auto !important; 
    }
}

        /* أنيميشن شريط الخريطة */
@keyframes map-ticker-move {
    0% { transform: translateX(0); }
    100% { transform: translateX(100%); }
}
#map-ticker-content:hover { animation-play-state: paused; }
.news-item { display: inline-block; margin-left: 60px; font-size: 14px; }
.separator { color: var(--border); margin: 0 10px; }

/* أنيميشن نقاط الخريطة التفاعلية */
.ripple-marker { display: flex; justify-content: center; align-items: center; }
.ripple-core { width: 6px; height: 6px; border-radius: 50%; position: absolute; }
.ripple-wave {
    width: 6px; height: 6px; border-radius: 50%; position: absolute;
    border: 1px solid; animation: ripple-simple 2s infinite;
}
@keyframes ripple-simple { 0% { transform: scale(1); opacity: 1; } 100% { transform: scale(4); opacity: 0; } }

.important-dot { display: flex; justify-content: center; align-items: center; }
.dot-core {
    width: 9px; height: 9px; border-radius: 50%;
    position: absolute; z-index: 10; border: 1.5px solid #fff; 
    box-shadow: 0 0 8px rgba(255,255,255,0.5);
}
.white-flash {
    width: 10px; height: 10px; border-radius: 50%;
    position: absolute; z-index: 9; 
    background: #ffffff; 
    filter: blur(3px);
    animation: white-flash-anim 1s infinite alternate;
}
@keyframes white-flash-anim { 0% { transform: scale(1); opacity: 0.2; } 100% { transform: scale(3.5); opacity: 0.7; } }

/* تنسيق النوافذ المنبثقة داخل الخريطة لتناسب ثيم الموقع */
.leaflet-popup-content-wrapper { background: var(--card-bg) !important; color: #fff !important; border: 1px solid var(--border) !important; border-radius: 8px !important; }
.leaflet-popup-tip { background: var(--card-bg) !important; border: 1px solid var(--border) !important; }
.popup-container { padding: 5px; text-align: right; min-width: 160px; line-height: 1.6; direction: rtl; }
.popup-title { font-weight: bold; font-size: 15px; border-bottom: 1px solid var(--border); margin-bottom: 6px; display: block; padding-bottom: 4px; }
.popup-row { font-size: 13px; color: #c9d1d9; }

/* تنسيق شريط الطقس */
.weather-ticker {
    background-color: var(--bg); /* نفس خلفية الموقع */
    color: var(--gold); /* اللون الذهبي الخاص بك */
    height: 35px; /* ارتفاع نحيف وناعم */
    display: flex;
    align-items: center;
    overflow: hidden;
    border-bottom: 1px solid var(--border);
    font-size: 13px;

}

/* تعديل الهيدر الحالي ليكون تحت شريط الطقس */
/* --- الهيدر العلوي المطور: ثيم العيد --- */
/* --- الهيدر العلوي المطور: ثيم العيد --- */
.nav-bar { 
    width: 100vw !important; /* إجبار البانر على أخذ كامل عرض شاشة العرض الفعلي */
    max-width: 100% !important; /* منع خروج أو تشوه الحواف نهائياً */
    height: 90px; 
    background: linear-gradient(135deg, #073b2a 0%, #0f5c43 40%, #c59b4c 85%, #e6ca83 100%);
    position: sticky; 
    top: 35px !important; /* أسفل شريط الطقس */
    left: 0;
    right: 0;
    margin: 0 !important; /* تصفير الهوامش لضمان المحاذاة الكاملة */
    z-index: 9999; 
    display: grid; 
    grid-template-columns: 1fr auto 1fr; 
    align-items: center; 
    padding: 0 40px; 
    box-sizing: border-box; /* احتساب الـ padding من الداخل لتجنب التمدد الزائد */
    border-bottom: 3px solid #f3e0aa;
    box-shadow: 0 4px 30px rgba(15, 92, 67, 0.3);
    overflow: hidden;
}

/* طبقة الغليتر واللمعان الديناميكية */
.glitter-layer {
    position: absolute;
    width: 100%;
    height: 100%;
    top: 0;
    left: 0;
    background-image: 
        radial-gradient(circle, #fff 1.5px, transparent 1.5px),
        radial-gradient(circle, #ffe596 1px, transparent 1px),
        radial-gradient(circle, #fff 2px, transparent 2px);
    background-size: 60px 60px, 40px 40px, 80px 80px;
    opacity: 0.3;
    z-index: 1;
    animation: glitter-move 6s infinite linear;
    pointer-events: none; /* لمنع حجب النقرات عن الأزرار */
}

/* ظلال المساجد الخلفية */
.eid-silhouettes {
    position: absolute;
    bottom: 0;
    left: 5%;
    width: 300px;
    height: 50px;
    opacity: 0.1;
    background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 30" fill="%23ffffff"><path d="M0 30V20l3-3 3 3v10h4V12l4-5 4 5v18h3V5l3-4 3 4v25h5V15l5-4 5 4v15h4V8l2-2 2 2v20h4V0l6 8 6-8v30h5V10l3-3 3 3v20h10v-30Z"/></svg>');
    background-repeat: repeat-x;
    background-size: contain;
    z-index: 1;
    pointer-events: none;
}

/* النجمة المضيئة النابضة */
.corner-star {
    position: absolute;
    bottom: 15px;
    left: 20px;
    color: #ffffff;
    font-size: 20px;
    opacity: 0.9;
    animation: pulse-star 1.5s infinite alternate;
    z-index: 2;
    pointer-events: none;
}

.right-section { display: flex; justify-content: flex-start; align-items: center; z-index: 3; }

/* --- التنسيقات النصية لعنوان المعايدة --- */

}

    animation: scrollWeather 40s linear infinite; /* سرعة هادئة */
}

@keyframes scrollWeather {
    /* التحريك من البداية (0) إلى منتصف المحتوى المكرر بالضبط */

    <script>
        const SHEET_ID = '1PFs77B59v6sM0je8KWgOG3MOOMBd-E0L';
        const USERS_SHEET_ID = '1JPGIQxNFPHu0lxupFVOUvfIrjxCe-fX_7qpsmIyx1qA';
        const CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv`;
        const USERS_CSV_URL = `https://docs.google.com/spreadsheets/d/${USERS_SHEET_ID}/export?format=csv`;

        let allData = []; let filteredData = []; let currentMode = 'libya'; let currentIndex = 0; let isLoading = false;

        function toggleMenu() { document.getElementById('navMenu').classList.toggle('open'); }
        function updateSectionDisplay(name) { document.getElementById('current-section-display').innerText = name; }

        function switchSection(sectionId, btn, sectionName) {
            document.querySelectorAll('.page-section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(sectionId).classList.add('active');
            btn.classList.add('active'); updateSectionDisplay(sectionName);
            document.getElementById('navMenu').classList.remove('open');
        }

        // تم تعديل هذه الدالة لتصفير العرض عند كل تبديل
        function switchNewsTab(mode, sectionName) {
            currentMode = mode;
            currentIndex = 0; // تصفير المؤشر للبدء من أول خبر
            document.getElementById('archive-container').innerHTML = ""; // مسح البطاقات الحالية فوراً
            
            document.querySelectorAll('.page-section').forEach(s => s.classList.remove('active'));
            document.getElementById('news-section').classList.add('active');
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            if(mode === 'libya') document.getElementById('libya-btn').classList.add('active');
            else document.getElementById('intl-btn').classList.add('active');
            
            updateSectionDisplay(sectionName); 
            applyFilter(); // سيقوم بتحميل أول 10 بطاقات من البداية
            document.getElementById('navMenu').classList.remove('open');
            window.scrollTo(0, 0); // العودة لأعلى الصفحة
        }

        async function attemptLogin() {
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value.trim();
            if(!user || !pass) return;
            try {
                const res = await fetch(USERS_CSV_URL);
                const text = await res.text();
                const rows = text.split('\n').map(r => r.split(',').map(c => c.replace(/"/g, '').trim()));
                if (rows.find(r => r[0] === user && r[1] === pass)) {
                    document.getElementById('login-overlay').style.display = 'none';
                    document.getElementById('main-content').style.display = 'block';
                    await fetchData(); setupInfiniteScroll();
                } else { document.getElementById('login-error').style.display = 'block'; }
            } catch (e) { alert("خطأ في الاتصال"); }
        }

        async function fetchData() {
            try {
                const res = await fetch(CSV_URL);
                const text = await res.text();
                const rows = text.split('\n').map(row => {
                    const result = []; let current = ''; let inQuotes = false;
                    for (let char of row) {
                        if (char === '"') inQuotes = !inQuotes;
                        else if (char === ',' && !inQuotes) { result.push(current.trim()); current = ''; }
                        else current += char;
                    }
                    result.push(current.trim()); return result;
                });
                allData = rows.slice(1).filter(r => r[1]).map(r => ({
                    country: r[0] || "عالمي", title: r[1] || "", content: r[2] || "", date: r[3] || "",
                    linkText: r[4] || "المزيد", linkURL: r[5] || "", img: r[6] || "",
                    sortKey: r[3] ? r[3].split('/').reverse().join('') : '00000000'
                }));
                applyFilter(); updateTicker();
            } catch (e) { console.error(e); }
        }

        function applyFilter() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            filteredData = allData.filter(item => {
                const matchesSearch = item.title.toLowerCase().includes(searchTerm) || 
                                    item.country.toLowerCase().includes(searchTerm) ||
                                    item.content.toLowerCase().includes(searchTerm);
                if (currentMode === 'libya') {
                    return matchesSearch && (item.country.includes('ليبيا') || item.title.includes('ليبيا') || item.content.includes('ليبيا'));
                }
                return matchesSearch; 
            });
            filteredData.sort((a, b) => {
                if (b.sortKey !== a.sortKey) return b.sortKey.localeCompare(a.sortKey);
                return a.country.localeCompare(b.country, 'ar');
            });
            renderNextBatch(true);
        }

        function updateTicker() {
            const ticker = document.getElementById('ticker-content');
            if (allData.length === 0) return;
            const sorted = [...allData].sort((a,b) => b.sortKey.localeCompare(a.sortKey));
            const latestDate = sorted[0].date;
            const latestNews = sorted.filter(item => item.date === latestDate);
            document.getElementById('ticker-label').innerHTML = `آخر الأخبار (${latestNews.length})`;
            let html = latestNews.map(item => `<div class="ticker-item"><span class="ticker-country">${item.country}</span> ${item.title}</div>`).join(' • ');
            ticker.innerHTML = html + " • " + html; 
            ticker.style.animationDuration = (ticker.innerText.length / 15) + "s";
        }

        function renderNextBatch(reset = false) {
            const container = document.getElementById('archive-container');
            const sentinel = document.getElementById('loading-sentinel');
            if (reset) { container.innerHTML = ""; currentIndex = 0; }
            if (isLoading) return;
            const chunk = filteredData.slice(currentIndex, currentIndex + 10);
            if (chunk.length === 0) { sentinel.innerHTML = currentIndex > 0 ? "نهاية الأرشيف" : "لا توجد أخبار حالياً"; return; }
            isLoading = true;
            let html = chunk.map(item => `
                <div class="card">
                    <span class="date-badge">${item.date}</span>
                    <div class="country-tag">🌍 ${item.country}</div>
                    <div class="title">${item.title}</div>
                    ${item.img ? `<img src="${item.img}" class="card-image" onerror="this.style.display='none'">` : ""}
                    <p>${item.content}</p>
                    <div class="card-footer">
                        ${item.linkURL ? `<span class="more-prefix">المصدر:</span><a href="${item.linkURL}" target="_blank" class="card-more-link">${item.linkText || 'إضغط هنا'}</a>` : ''}
                    </div>
                </div>`).join('');
            container.insertAdjacentHTML('beforeend', html);
            currentIndex += 10; isLoading = false; sentinel.innerHTML = "تحميل المزيد...";
        }

        function setupInfiniteScroll() {
            const observer = new IntersectionObserver((entries) => { if (entries[0].isIntersecting && !isLoading) renderNextBatch(); }, { threshold: 0.1 });
            observer.observe(document.getElementById('loading-sentinel'));
        }

        function handleSearch() { 
            currentIndex = 0; // تصفير عند البحث أيضاً
            applyFilter(); 
        }

        // إعدادات جلب الطقس للمدن الليبية
const weatherApiKey = "397d303d3f4447ac2304075b6f157a86";
const libyaCities = ["Tripoli", "Benghazi", "Misrata", "Bayda", "Tobruk", "Sabha"];

async function updateLibyaWeather() {
        try {
            const track = document.getElementById('weatherTrack');
            const weatherPromises = libyaCities.map(city => 
                fetch(`https://api.openweathermap.org/data/2.5/weather?q=${city},LY&appid=${weatherApiKey}&units=metric&lang=ar`)
                .then(res => res.json())
            );

            const results = await Promise.all(weatherPromises);
            
            let weatherHTML = results.map(data => {
                if (data.main) {
                    return `
                    <div class="weather-city-item">
                        <span>🌡️ ${Math.round(data.main.temp)}°م</span>
                        <span>☁️ ${data.weather[0].description}</span>
                        <span>📍 ${data.name}</span>
                    </div>`;
                }
                return '';
            }).join('');

            track.innerHTML = weatherHTML + weatherHTML;
            
        } catch (error) {
            console.error("تعذر جلب بيانات الطقس عند الإقلاع");
        }
    }

// تشغيل الوظيفة فوراً عند فتح المنصة
updateLibyaWeather();

// تحديث البيانات تلقائياً كل 5 ثوانٍ كما طلبت
// setInterval(updateLibyaWeather, 5000);

// متغيرات الخريطة الجيوسياسية
let geoMapInstance = null;
const GEO_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQuJTi1AS4y4r42nuYtXMtkPOJ2m0oCN58LEeM191fuur_ATlkufcp69HmHSPkAWiiixWlLCMJo-kkq/pub?output=csv';

function initGeoMap() {
    // بناء الخريطة مرة واحدة فقط لمنع الأخطاء البرمجية
    if (geoMapInstance) {
        setTimeout(() => geoMapInstance.invalidateSize(), 100);
        return;
    }

    geoMapInstance = L.map('leaflet-map', { zoomControl: true }).setView([20, 0], 2);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(geoMapInstance);

    Papa.parse(GEO_CSV_URL, {
        download: true,
        header: true,
        complete: function(results) {
            const data = results.data.filter(r => r.cord && r.date);
            
            const parseDate = (str) => {
                const p = str.split(/[\/-]/);
                return new Date(p[2], p[1]-1, p[0]);
            };
            
            const sortedData = [...data].sort((a, b) => parseDate(b.date) - parseDate(a.date));
            const latestDateStr = sortedData.length > 0 ? sortedData[0].date : null;

            const markers = L.featureGroup();
            const focusGroup = L.featureGroup();
            let tickerContentHtml = "";

            data.forEach(row => {
                const coords = row.cord.split(',');
                if (coords.length === 2) {
                    let lat = parseFloat(coords[0].trim());
                    let lng = parseFloat(coords[1].trim());

                    if (!isNaN(lat) && !isNaN(lng)) {
                        const isImportant = (row.date === latestDateStr);
                        const color = row.color || 'cyan';

                        if (isImportant) {
                            tickerContentHtml += `
                                <span class="news-item">
                                    <b style="color:${color}">${row.sitename}</b> 
                                    <span class="separator">|</span> 
                                    <span>${row['at-type']}</span> 
                                    <span class="separator">|</span> 
                                    <span style="color:#00ffcc">${row.time}</span>
                                </span>`;
                        }

                        const icon = L.divIcon({
                            className: isImportant ? 'important-dot' : 'ripple-marker',
                            html: isImportant ? 
                                `<div class="white-flash"></div><div class="dot-core" style="background-color:${color}"></div>` :
                                `<div class="ripple-wave" style="border-color:${color}"></div><div class="ripple-core" style="background-color:${color}"></div>`,
                            iconSize: [30, 30],
                            iconAnchor: [15, 15]
                        });

                        const marker = L.marker([lat, lng], { icon: icon, zIndexOffset: isImportant ? 1000 : 0 });
                        
                        marker.bindPopup(`
                            <div class="popup-container">
                                <span class="popup-title" style="color:${color}">${row.sitename}</span>
                                <div class="popup-row"><b>النوع:</b> ${row['at-type']}</div>
                                <div class="popup-row"><b>التاريخ:</b> ${row.date}</div>
                                <div class="popup-row"><b>الوقت:</b> ${row.time}</div>
                            </div>
                        `);
                        
                        marker.addTo(markers);
                        if (isImportant) marker.addTo(focusGroup);
                    }
                }
            });

            markers.addTo(geoMapInstance);
            
            // تحديث شريط الأخبار الخاص بالخريطة
            const tickerEl = document.getElementById('map-ticker-content');
            if(tickerContentHtml !== "") {
                tickerEl.innerHTML = tickerContentHtml;
                const textWidth = tickerEl.scrollWidth;
                const duration = textWidth / 50; 
                tickerEl.style.animationDuration = Math.max(25, duration) + "s";
            }
            
            // التركيز على النقاط الأخيرة
            if (focusGroup.getLayers().length > 0) {
                geoMapInstance.fitBounds(focusGroup.getBounds(), { padding: [50, 50], maxZoom: 5 });
            }
        }
    });
}

// تعديل الدالة الحالية للموقع لتقوم بتشغيل الخريطة عند الضغط على زر القائمة
const originalSwitchSection = switchSection;
switchSection = function(sectionId, btn, sectionName) {
    // إخفاء حاوية الخريطة تماماً لمنعها من تغطية الشاشة
    const mapSection = document.getElementById('giomap');
    if (mapSection) mapSection.style.display = 'none';
    
    // تشغيل التبديل العادي للأقسام
    originalSwitchSection(sectionId, btn, sectionName);
    
    // إذا كان القسم المطلوب هو الخريطة، أظهرها وقم بتحديث أبعادها
    if (sectionId === 'giomap') {
        if (mapSection) mapSection.style.display = 'block';
        initGeoMap();
        setTimeout(() => {
            if (geoMapInstance) geoMapInstance.invalidateSize();
        }, 250);
    }
}

// 2. تحديث دالة تبويب الأخبار (أخبار ليبيا / الدولية) لتجبر الخريطة على الاختفاء أيضاً
const originalSwitchNewsTab = switchNewsTab;
switchNewsTab = function(mode, sectionName) {
    // إخفاء الخريطة فوراً عند العودة للأخبار
    const mapSection = document.getElementById('giomap');
    if (mapSection) mapSection.style.display = 'none';
    
    // تشغيل دالة تبديل الأخبار الأصلية بكفاءة
    originalSwitchNewsTab(mode, sectionName);

    // إغلاق القائمة الجانبية تلقائياً عند النقر في أي مكان خارجها
document.addEventListener('click', function(event) {
    const navMenu = document.getElementById('navMenu');
    const menuToggle = document.querySelector('.menu-toggle');

    // التحقق مما إذا كانت القائمة مفتوحة حالياً
    if (navMenu.classList.contains('open')) {
        /* 
           إذا كانت النقرة خارج صندوق القائمة (navMenu) 
           وفي نفس الوقت خارج زر فتح القائمة (menuToggle) ومشتقاته
        */
        if (!navMenu.contains(event.target) && !menuToggle.contains(event.target)) {
            navMenu.classList.remove('open'); // إغلاق القائمة بسحب الكلاس
        }
    }
});
}
    </script>
